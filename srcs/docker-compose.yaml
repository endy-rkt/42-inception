version: '3'
services:
  mariadb:
    image: mariadb:0.1
    container_name: mariadb
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    restart: always
  php-fpm:
    image: php:0.1
    container_name: php
    depends_on:
      - mariadb
    ports:
      - "9000:9000"
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always
  nginx:
    image: nginx:0.1
    container_name: nginx
    depends_on:
      - mariadb
    ports:
      - "8080:443"
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always

volumes:
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/wordpress
      o: bind

  db-data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/mysql
      o: bind