version: '3'
services:
  mariadb:
    image: mariadb:0.2
    container_name: mariadb
    ports:
      - "8000:3306"
    volumes:
      - /home/trazanad/data/wp_db:/var/lib/mysql/wp_db
  php-fpm:
    image: php:0.1
    container_name: php
    ports:
      - "8001:80"
    volumes:
      - /home/trazanad/data/wordpress:/var/lib/wordpress
  nginx:
    image: nginx:0.1
    container_name: nginx
    ports:
      - "8080:443"
    volumes:
      - /home/trazanad/data/wordpress:/var/www/trazanad.42.fr

