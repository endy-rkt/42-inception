version: '3'
services:
  mariadb:
    image: mariadb:0.1
    container_name: mariadb
    build: requirements/mariadb
    networks:
      - wp-db-net
      - adminer-db-net
      - redis-db-net
    environment:
      - DB_USER 
      - DB_NAME
    secrets:
      - db_pass
      - db_root_pass
    volumes:
      - db-data:/var/lib/mysql
    restart: always

  wordpress:
    image: wordpress:0.1
    container_name: wordpress
    build: requirements/wordpress
    depends_on:
      - mariadb
    networks:
      - wp-db-net
      - wp-redis-net
      - wp-nginx-net
    environment:
      - DB_NAME
      - DB_USER 
      - DB_HOST
      - WP_ADMIN 
      - WP_ADMIN_EMAIL
      - WP_USER 
      - WP_USER_EMAIL
    secrets:
      - db_pass
      - wp_admin_pswd
      - wp_user_pswd
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always

  nginx:
    image: nginx:0.1
    container_name: nginx
    build: requirements/nginx
    depends_on:
      - mariadb
    ports:
      - "443:443"
    networks:
      - wp-nginx-net
      - adminer-nginx-net
      - nginx-flask-net
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always

  ftp:
    image: ftp:0.1
    container_name: ftp
    build: requirements/ftp
    networks:
      - ftp-rsync-net
    ports:
      - "7000:21"
      - "60000-60010:60000-60010"
    environment:
      - FTP_USER
      - FTP_GROUP
    secrets:
      - ftp_user_pswd
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always

  redis:
    image: redis:0.1
    container_name: redis
    build: requirements/redis
    networks:
      - wp-redis-net
      - adminer-redis-net
      - redis-db-net
    restart: always

  rsync:
    image: rsync:0.1
    container_name: rsync
    build: requirements/rsync
    networks:
      - ftp-rsync-net
    volumes:
      - wp-data:/var/www/trazanad.42.fr
      - backup-data:/backup
    restart: always
  
  flask:
    image: flask:0.1
    container_name: flask
    build: requirements/flask
    networks:
      - nginx-flask-net
    restart: always

  adminer:
    image: adminer:0.1
    container_name: adminer
    build: requirements/adminer
    depends_on:
      - nginx
    networks:
      - adminer-db-net
      - adminer-redis-net
      - adminer-nginx-net
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always

networks:
  wp-db-net:
  wp-redis-net:
  wp-nginx-net:
  adminer-db-net:
  adminer-redis-net:
  adminer-nginx-net:
  nginx-flask-net:
  ftp-rsync-net:
  redis-db-net:

secrets:
  ftp_user_pswd:
    file: ../secrets/ftp_user_pswd.txt
  db_pass:
    file: ../secrets/db_pass.txt
  db_root_pass:
    file: ../secrets/db_root_pass.txt
  wp_admin_pswd:
    file: ../secrets/wp_admin_pswd.txt
  wp_user_pswd:
    file: ../secrets/wp_user_pswd.txt

volumes:
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/wordpress
      o: bind

  db-data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/mysql
      o: bind

  backup-data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/backup
      o: bind