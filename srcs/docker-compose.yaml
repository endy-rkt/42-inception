version: '3'
services:
  mariadb:
    image: mariadb:0.1
    container_name: mariadb
    # networks:
    #   - php-db-net
    volumes:
      - db-data:/var/lib/mysql
    restart: always
  php-fpm:
    image: php:0.1
    container_name: php
    depends_on:
      - mariadb
    # networks:
    #   - php-db-net
    #   - php-nginx-net
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always
  nginx:
    image: nginx:0.1
    container_name: nginx
    depends_on:
      - mariadb
    ports:
      - "8080:443"
    # networks:
    #   - php-nginx-net
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always
  ftp:
    image: ftp:0.1
    container_name: ftp
    ports:
      - "7000:21"
      - "60000-60010:60000-60010"
    volumes:
      - wp-data:/var/www/trazanad.42.fr
    restart: always
  # redis:
  #   image: redis:0.0
  #   container_name: redis
  #   ports:
  #     - "6379:6379"
  #   restart: always

# networks:
#   php-nginx-net:
#   php-db-net:

volumes:
  wp-data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/wordpress
      o: bind

  db-data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/mysql
      o: bind